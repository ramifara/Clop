name: Windows image app
# A pushed v<version> tag builds and tests both architectures as any run does, then publishes them as that version's GitHub release (the
# `release` job). A tag pushed before this job existed, or a release whose run failed, is published by running the workflow by hand with the tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Publish this existing v<version> tag as a release (empty to only build main)
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install
        run: npm ci
      - name: Restore bundled tools
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: windows/.tools
          key: clop-tools-${{ runner.os }}-${{ hashFiles('windows/scripts/tools.json', 'windows/scripts/fetch-tools.mjs') }}
      - name: Fetch bundled tools
        id: fetch-tools
        run: node scripts/fetch-tools.mjs
      # Saved straight after a successful fetch, so a later failing step does not discard the download.
      - name: Save bundled tools
        if: always() && steps.fetch-tools.outcome == 'success' && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: windows/.tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Test engine and bundled tools
        run: npm test
      - name: Compile Windows helper
        shell: powershell
        run: powershell.exe -NoProfile -Sta -File native/bridge.ps1 -Check
      # Also compiles native/clop.cs into clop.exe with the .NET Framework's csc.exe.
      - name: Build application
        run: npm run build
      - name: Check native clipboard integration
        timeout-minutes: 3
        run: node scripts/native-smoke.mjs
      - name: Build installer and portable app
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check the app is long path aware
        run: node scripts/check-long-path.mjs
      - name: Exercise packaged Windows app
        timeout-minutes: 5
        run: node scripts/desktop-smoke.mjs
      - name: Exercise packaged clop command
        timeout-minutes: 5
        run: node scripts/cli-smoke.mjs
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Clop-Windows-x64
          path: |
            windows/release/*.exe
            windows/release/*.blockmap
            windows/release/latest.yml
            windows/release/Windows-*.png
          if-no-files-found: error
          retention-days: 30
  # The ARM64 app is built and exercised on a native ARM64 runner (free for public repositories), not cross-built on x64: sharp's
  # ARM64 package, the ARM64 tools and the packaged app then all run where users will run them. It runs every step the x64 job does.
  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 40
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Show the machine
        run: node -e "console.log(process.version, process.platform, process.arch); if (process.arch !== 'arm64') throw new Error('Expected a native ARM64 Node on the ARM64 runner.')"
      - name: Install
        run: npm ci
      - name: Restore bundled tools
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: windows/.tools
          key: clop-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('windows/scripts/tools.json', 'windows/scripts/fetch-tools.mjs') }}
      # Fetches the win32-arm64 set, because that is this machine's architecture.
      - name: Fetch bundled tools
        id: fetch-tools
        run: node scripts/fetch-tools.mjs
      - name: Save bundled tools
        if: always() && steps.fetch-tools.outcome == 'success' && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: windows/.tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Test engine and bundled tools
        run: npm test
      - name: Compile Windows helper
        shell: powershell
        run: powershell.exe -NoProfile -Sta -File native/bridge.ps1 -Check
      # Also compiles native/clop.cs into clop.exe with the ARM64 .NET Framework's csc.exe.
      - name: Build application
        run: npm run build
      - name: Check native clipboard integration
        timeout-minutes: 3
        run: node scripts/native-smoke.mjs
      - name: Build installer and portable app
        run: npx electron-builder --win nsis portable --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check the packaged files are ARM64, apart from the tools that run under emulation
        run: node scripts/check-arch.mjs arm64
      - name: Check the app is long path aware
        run: node scripts/check-long-path.mjs
      - name: Exercise packaged Windows app
        timeout-minutes: 5
        run: node scripts/desktop-smoke.mjs
      - name: Exercise packaged clop command
        timeout-minutes: 5
        run: node scripts/cli-smoke.mjs
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Clop-Windows-arm64
          path: |
            windows/release/*.exe
            windows/release/*.blockmap
            windows/release/latest.yml
            windows/release/Windows-*.png
          if-no-files-found: error
          retention-days: 30
  # Publishes a tagged build. The release is created as a draft and only made public once every file is on it, so an update check never
  # finds a release without its latest.yml. A rerun after a failure finishes a draft it left; a release already public is not touched.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [windows, windows-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      # Only js-yaml is needed here; skipping install scripts skips Electron's download.
      - name: Install
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: Clop-Windows-x64
          path: windows/out/x64
      - uses: actions/download-artifact@v4
        with:
          name: Clop-Windows-arm64
          path: windows/out/arm64
      - name: Check the version and write the release's latest.yml and notes
        id: info
        run: node scripts/release.mjs --tag "$TAG" --out out out/x64 out/arm64
      - name: Publish the release
        run: |
          files=(out/x64/*.exe out/arm64/*.exe out/x64/*.blockmap out/arm64/*.blockmap out/latest.yml)
          ls -l "${files[@]}"
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then echo "::error::The release $TAG is already published; it is left as it is."; exit 1; fi
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            flags=(); if [ "${{ steps.info.outputs.prerelease }}" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
            gh release create "$TAG" "${files[@]}" --draft --verify-tag --title "Clop for Windows ${{ steps.info.outputs.version }}" --notes-file out/notes.md "${flags[@]}"
          fi
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,isPrerelease,assets --jq '{url, isPrerelease, assets: [.assets[].name]}'
